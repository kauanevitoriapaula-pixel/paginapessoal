<style>
/* seção 2026 */
.pessoas {
  margin-top: -35px;
  padding-top: 10px;
  text-align: center;
}

.pessoas-titulo {
  text-align: center;
}

/* organização fotos */
.cards {
  display: flex;
  justify-content: center;
  align-items: stretch;
  flex-wrap: wrap;
  gap: 20px;
  padding: 10px 20px;
}

/* Cartões das fotos */
.pessoas .card {
  width: 260px;
  overflow: hidden;
  border-radius: 10px;
}

/* Imagens das pessoas */
.pessoas .foto {
  display: block;
  width: 100%;
  height: 300px;
  object-fit: cover;
  border-radius: 10px;
}

/* Ajustes para celular */
@media (max-width: 600px) {
  .pessoas {
    margin-top: -20px;
  }

  .cards {
    gap: 15px;
    padding: 10px;
  }

  .pessoas .card {
    width: calc(50% - 10px);
  }

  .pessoas .foto {
    height: 210px;
  }
}
</style>
</head>
